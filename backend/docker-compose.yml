# Build settings shared by migrate, api and worker. The two named contexts feed the Dockerfile's
# `COPY --from` lines: the calibration artifact and the detector contract live outside backend/.
x-app-build: &app-build
  context: .
  additional_contexts:
    ml-weights: ../ml/weights
    contracts: ../contracts

services:
  postgres:
    image: postgres:17
    container_name: veritrust-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veritrust
    ports:
      # Host port only. Override with POSTGRES_PORT in backend/.env (compose reads it) when
      # something already owns 5432 on this machine -- a native Postgres install is the usual
      # culprit. The container-internal port stays 5432, so the app services below, which reach
      # it as `postgres:5432` over the compose network, are unaffected.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: veritrust-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: veritrust-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI: http://localhost:8025

  # ---- App containers (opt-in) ----
  # Local dev doesn't need these: `npm run dev` / `npm run worker` on the host is faster to iterate
  # on. They exist so the exact production image (Dockerfile) can be built and smoke-tested locally
  # before a real deploy — run with `docker compose --profile app up --build`.
  migrate:
    # Targets the `build` stage, not the final runtime image: the `prisma` CLI is a devDependency
    # (the runtime image is `npm ci --omit=dev`, deliberately without it — see Dockerfile), and only
    # `build` still has the full source tree plus dev deps to run it from.
    build:
      <<: *app-build
      target: build
    profiles: ["app"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veritrust
      REDIS_URL: redis://redis:6379
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *app-build
    profiles: ["app"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veritrust
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    ports:
      - "9000:9000"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: *app-build
    profiles: ["app"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veritrust
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    command: ["node", "dist/worker.js"]
    # The Dockerfile's HEALTHCHECK probes the API's /ready over HTTP; the worker never opens a port,
    # so that check would just fail forever here — disable it rather than inherit a meaningless one.
    healthcheck:
      disable: true
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
