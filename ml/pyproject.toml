[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtml"
version = "0.1.0"
description = "VeriTrust integrity evidence-fusion engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "mypy",
    # Offline fixture generation only (detectors/offline_video.py). Never
    # imported by the runtime path -- Rules.md section 3.
    "mediapipe",
    "opencv-python-headless",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
# scikit-learn ships no type stubs and no py.typed marker. This says exactly
# that and nothing more -- the modules that import it stay fully checked
# (Rules.md section 4: do not narrow the scope to make a module pass).
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
