name: veritrust

# The two named contexts feed the backend Dockerfile's `COPY --from` lines: the calibration
# artifact and the detector contract live outside backend/, so the build needs them passed in
# explicitly (see backend/docker-compose.yml, which the backend Dockerfile was written against).
x-backend-build: &backend_build
  context: ../backend
  additional_contexts:
    ml-weights: ../ml/weights
    contracts: ../contracts

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        # Baked in at build time (Next.js NEXT_PUBLIC_* vars are compile-time), so the coturn
        # service below must exist and these must be set before this image is built.
        NEXT_PUBLIC_TURN_URL: turn:${DOMAIN}:3478
        NEXT_PUBLIC_TURN_USERNAME: ${TURN_USERNAME:?Set TURN_USERNAME in .env.production}
        NEXT_PUBLIC_TURN_CREDENTIAL: ${TURN_PASSWORD:?Set TURN_PASSWORD in .env.production}
    restart: unless-stopped
    expose:
      - "3000"

  # Relays WebRTC media for the interviewer<->candidate call when either side is behind a NAT/
  # firewall that STUN alone can't traverse (see frontend/lib/rtc-config.ts). Host networking is
  # required: coturn needs to advertise and listen on the same wide UDP port range it relays
  # through, which doesn't survive Docker's default per-port NAT mapping.
  turn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - turnserver
      - --no-cli
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${DOMAIN:?Set DOMAIN in .env.production}
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in .env.production}:${TURN_PASSWORD:?Set TURN_PASSWORD in .env.production}
      # Paired public/private form, not just the public IP alone: with host networking, coturn also
      # sees Docker's bridge interfaces (e.g. 172.17.0.1) alongside the real NIC, and given only a
      # public IP it can't tell which local address to substitute -- it silently drops external-ip
      # for relay candidates and advertises private/bridge addresses no external client can reach.
      # Pairing removes the ambiguity. Find the private IP with `hostname -I | awk '{print $1}'`.
      - --external-ip=${SERVER_PUBLIC_IP:?Set SERVER_PUBLIC_IP in .env.production}/${SERVER_PRIVATE_IP:?Set SERVER_PRIVATE_IP in .env.production}
      - --listening-ip=${SERVER_PRIVATE_IP:?Set SERVER_PRIVATE_IP in .env.production}
      - --relay-ip=${SERVER_PRIVATE_IP:?Set SERVER_PRIVATE_IP in .env.production}
      - --min-port=49160
      - --max-port=49200

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: veritrust
      POSTGRES_USER: veritrust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritrust -d veritrust"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Run manually before the first app start and whenever migrations are added.
  migrate:
    build:
      <<: *backend_build
      target: build
    profiles: ["admin"]
    environment: &backend_environment
      NODE_ENV: production
      PORT: 9000
      APP_URL: https://${DOMAIN}
      API_URL: https://${DOMAIN}/api/v1
      CORS_ORIGINS: https://${DOMAIN}
      DATABASE_URL: postgresql://veritrust:${POSTGRES_PASSWORD}@postgres:5432/veritrust
      REDIS_URL: redis://redis:6379
      HASH_PEPPER: ${HASH_PEPPER}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_TTL_DAYS: 30
      JOIN_TOKEN_SECRET: ${JOIN_TOKEN_SECRET}
      CANDIDATE_TOKEN_SECRET: ${CANDIDATE_TOKEN_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      EVIDENCE_SIGNING_PRIVATE_KEY: ${EVIDENCE_SIGNING_PRIVATE_KEY}
      EVIDENCE_SIGNING_KEY_ID: production-1
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/storage
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-VeriTrust <no-reply@${DOMAIN}>}
      # "groq" is real JD parsing / suggestions / grading via the free Groq API. Requires
      # GROQ_API_KEY (console.groq.com) in .env.production.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      MEDIA_PROVIDER: mock
      # "docker" is real, per-run-isolated candidate code execution (no network, read-only rootfs,
      # resource-capped — see backend/src/providers/sandbox/docker.sandbox.ts). It needs the api
      # service's Docker-socket mount below. "piston" (a free external sandbox) is defined but not
      # usable as of 2026-02: the public Piston API went whitelist-only.
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-mock}
      TMPDIR: /var/lib/veritrust-sandbox-tmp
      REPORT_PDF_ENABLED: "false"
      CALIBRATED_WEIGHTS_ENABLED: "false"
      RETENTION_MEDIA_DAYS: 90
      RETENTION_OBSERVATIONS_DAYS: 180
      RETENTION_EVIDENCE_LOG_FLOOR_DAYS: 30
      RETENTION_REPORTS_DAYS: 1095
      RETENTION_CRON: "0 3 * * *"
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *backend_build
    restart: unless-stopped
    environment: *backend_environment
    # Only needed when SANDBOX_PROVIDER=docker. The api container runs as a non-root user (see
    # backend/Dockerfile) which owns none of the host's docker.sock groups by default, so it gets
    # EACCES connecting to the socket below unless it's also a member of the host's docker group.
    # Find that GID with `getent group docker` on the host and set DOCKER_GID in .env.production.
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env.production (run: getent group docker | cut -d: -f3)}"
    expose:
      - "9000"
    volumes:
      - app_storage:/app/storage
      # Only needed when SANDBOX_PROVIDER=docker. Lets docker.sandbox.ts launch per-run sandbox
      # containers via the HOST's Docker daemon. Security tradeoff: anything that compromises this
      # container gets that socket, which is root-equivalent on the host — only api gets it
      # (worker/migrate never execute candidate code, so they don't).
      - /var/run/docker.sock:/var/run/docker.sock
      # Must be bind-mounted at the identical absolute path on the host (create it there first: see
      # README) — the sandbox provider's temp-file paths get handed to the host daemon as bind-mount
      # sources, which only resolve correctly if this container's view of the path IS the host's.
      - /var/lib/veritrust-sandbox-tmp:/var/lib/veritrust-sandbox-tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: *backend_build
    restart: unless-stopped
    environment: *backend_environment
    command: ["node", "dist/worker.js"]
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  app_storage:
